name: Release

# Runs when a GitHub release is published:
#   verify  -> tag matches Cargo.toml, tests and crate contents pass
#   binaries -> build the CLI per target and attach archives to the release
#   publish -> cargo publish (last, because crates.io is irreversible)
#
# Assets are named `is-ai-agent-<tag>-<target>.{tar.gz,zip}` so mise can pick
# one by OS/arch: `mise use -g github:sdairs/is-ai-agent`.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (parsed as '$TAG') does not match Cargo.toml version '$VERSION'"
            exit 1
          fi

      - name: Run tests
        run: cargo test --verbose

      - name: Verify published crate contents
        run: python3 .github/scripts/check-package.py

  binaries:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: is-ai-agent
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          locked: true

  publish:
    name: Publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
